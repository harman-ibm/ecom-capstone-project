spring.application.name=ecom

# --- Database: in-memory H2 by default (zero setup). Use the "postgres" profile for PostgreSQL. ---
spring.datasource.url=jdbc:h2:mem:ecom;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- JWT ---
# HS256 needs >= 32 bytes. Override with the ECOM_JWT_SECRET environment variable in any real deployment.
app.jwt.secret=${ECOM_JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
app.jwt.expiration-minutes=60

# --- CORS: origins allowed to call the API (comma separated) ---
app.cors.allowed-origins=${ECOM_CORS_ORIGINS:http://localhost:3000}

# --- API docs (Swagger UI: /swagger-ui.html, OpenAPI JSON: /v3/api-docs) ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
